<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>التحذيرات</title>
    <style>
        /* 1. ضبط خلفية الصفحة بالكامل لتكون موحدة وغير متقطعة */
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh; /* يجعل الخلفية تغطي الشاشة بالكامل */
        }

        body {
            /* لون الخلفية المتدرج الداكن */
            background: linear-gradient(180deg, #2b2b2b, #111111);
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            color: #ffffff;
            font-family: Arial, sans-serif;
            
            /* توسيط المحتوى وتوزيعه بشكل مريح يملأ الشاشة */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        /* 2. تنسيق العنوان الرئيسي */
        h1 {
            color: #ff3333;
            font-size: 3rem;
            margin-bottom: 20px;
        }

        /* 3. تنسيق النص الفرعي ليكون عريضاً ومالئاً للشاشة */
        h2 {
            font-size: 1.6rem;
            max-width: 900px;
            line-height: 1.8;
            font-weight: normal;
            margin-bottom: 30px;
        }

        /* 4. تنسيق h3 بالتدرج اللوني الشهير */
        h3 {
            font-size: 2.2rem;
            font-weight: bold;
            background: linear-gradient(45deg, #ff5733, #c70039, #900c3f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 40px;
        }

        /* 5. الفوتر */
        footer {
            font-size: 1.1rem;
            color: #888888;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <h1>تحذير بالغ الاهميه</h1>
    
    <h2>هذا الخطاب بالغ الاهميه و متجه الى الطالبه صفاء عابر رمزى , بخصوص انتهاك المصطلحات الخاصه الغير متداوله اطلاقا و هذا يعد انتهاكا للخصوصيه</h2>
    
    <h3># الطالبه صفاء عابر رمزى</h3>

    <footer class="foo">بوبايا ©</footer>

</body>
</html>
