<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مكتبة الرف الأخضر</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#12302f;--paper:#eef2ef;--line:#d3ddd9;--brass:#b0802a;--muted:#5d716f;--danger:#a3341f;--ok:#1f6b45}
*{box-sizing:border-box}
body{margin:0;font-family:Tajawal,sans-serif;background:var(--paper);color:var(--ink);line-height:1.7}
.top{background:var(--ink);color:#f2efe6;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;border-bottom:4px solid var(--brass)}
.top h1{margin:0;font-family:"Reem Kufi",sans-serif;font-size:1.8rem}
.top nav{display:flex;align-items:center;gap:10px}
.banner{background:#fff3d6;border-bottom:1px solid #e3cf9b;padding:10px 22px;font-size:.95rem}
main{max-width:980px;margin:24px auto;padding:0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-family:"Reem Kufi",sans-serif;font-size:1.25rem}
.auth{max-width:420px;margin:36px auto}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tab{flex:1;padding:10px;border:0;border-bottom:3px solid var(--line);background:none;font:inherit;font-weight:500;color:var(--muted);cursor:pointer}
.tab.on{color:var(--ink);border-color:var(--brass)}
.stack{display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:5px;font-weight:500}
input,textarea,select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:#fbfcfb;color:var(--ink);width:100%}
:focus-visible{outline:3px solid var(--brass);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:6px}
.primary{background:var(--ink);color:#fff;border:0;padding:10px 18px;font-weight:700}
.primary:hover{background:#1c4a48}
.ghost{background:none;border:1px solid #f2efe6;color:#f2efe6;padding:5px 12px}
.small{background:none;border:1px solid var(--ink);color:var(--ink);padding:4px 12px}
.danger{background:none;border:1px solid var(--danger);color:var(--danger);padding:4px 12px}
.badge{background:var(--brass);color:#fff;padding:1px 10px;border-radius:99px;font-size:.85rem}
.msg{min-height:1.3em;margin:10px 0 0;color:var(--danger);font-weight:500}
.msg.ok{color:var(--ok)}
.row{display:grid;grid-template-columns:2fr 1.5fr 1fr 90px auto;gap:10px}
.layout{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
.shelf{display:flex;flex-direction:column;gap:10px}
.book{display:grid;grid-template-columns:10px 1fr auto;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.spine{align-self:stretch;border-radius:4px}
.book h3{margin:0;font-family:"Reem Kufi",sans-serif;font-size:1.15rem}
.book p{margin:0;color:var(--muted)}
.acts{display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:center}
.acts span{font-size:.85rem;color:var(--muted)}
.cart li{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
.cart ul{padding:0;margin:0 0 12px;list-style:none}
.order{border-right:5px solid var(--brass)}
.order header{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.order ul{margin:6px 0;padding-inline-start:20px}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:26px 0}
@media(max-width:760px){.layout{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.row .primary{grid-column:1/-1}}
</style>
</head>
<body>
<header class="top">
  <h1>مكتبة الرف الأخضر</h1>
  <nav id="userBar" hidden><span id="userName"></span><span id="role" class="badge"></span><button id="logout" class="ghost">تسجيل خروج</button></nav>
</header>
<div id="banner" class="banner" hidden></div>

<main>
  <section id="authView" class="card auth">
    <div class="tabs"><button id="tLogin" class="tab on">تسجيل الدخول</button><button id="tReg" class="tab">حساب جديد</button></div>
    <div id="loginForm" class="stack">
      <label>اسم المستخدم أو البريد الإلكتروني<input id="lId" type="text" dir="ltr" autocomplete="username"></label>
      <label>كلمة المرور<input id="lPass" type="password" dir="ltr" autocomplete="current-password"></label>
      <button id="lBtn" class="primary">دخول</button>
    </div>
    <div id="regForm" class="stack" hidden>
      <label>الاسم<input id="rName" type="text" autocomplete="name"></label>
      <label>البريد الإلكتروني<input id="rEmail" type="email" dir="ltr" autocomplete="email"></label>
      <label>كلمة المرور (6 حروف على الأقل)<input id="rPass" type="password" dir="ltr" autocomplete="new-password"></label>
      <button id="rBtn" class="primary">إنشاء الحساب</button>
    </div>
    <p id="authMsg" class="msg" role="alert"></p>
  </section>

  <section id="appView" hidden>
    <div class="tabs"><button id="tBooks" class="tab on">الكتب</button><button id="tOrders" class="tab"></button></div>

    <div id="booksView">
      <div id="adminPanel" class="card" hidden>
        <h2>إضافة كتاب</h2>
        <div class="row">
          <input id="bTitle" placeholder="اسم الكتاب"><input id="bAuthor" placeholder="المؤلف">
          <input id="bCat" placeholder="التصنيف"><input id="bCopies" type="number" min="1" value="1">
          <button id="bAdd" class="primary">إضافة</button>
        </div>
        <p id="adminMsg" class="msg" role="alert"></p>
      </div>
      <div class="card"><input id="search" type="search" placeholder="ابحث باسم الكتاب أو المؤلف أو التصنيف"></div>
      <div class="layout">
        <div><div id="books" class="shelf"></div><p id="noBooks" class="empty" hidden></p></div>
        <aside id="cart" class="card cart"></aside>
      </div>
    </div>

    <div id="ordersView" hidden><div id="orders"></div><p id="noOrders" class="empty" hidden></p></div>
  </section>
</main>

<script type="module">
const firebaseConfig = {
  apiKey: "AIzaSyAdbgUr0F24r0B9wWjdIZgMCvFxExPDch0",
  authDomain: "library-cf11d.firebaseapp.com",
  projectId: "library-cf11d",
  storageBucket: "library-cf11d.firebasestorage.app",
  messagingSenderId: "845112290756",
  appId: "1:845112290756:web:9fb7ec85acaf64cf1d0891",
  measurementId: "G-D07WM2RFQD"
};

const ADMIN_USER = "ammin";
const ADMIN_EMAIL = ADMIN_USER + "@library.app";
const STATUSES = ["جديد", "جاري التجهيز", "تم التسليم", "ملغي"];
const live = !firebaseConfig.apiKey.includes("حط");
const toEmail = (id) => id.includes("@") ? id : id.toLowerCase() + "@library.app";
const ERR = {
  "auth/invalid-credential": "اسم المستخدم أو كلمة المرور غلط.",
  "auth/invalid-email": "شكل البريد غير صحيح.",
  "auth/email-already-in-use": "البريد ده مسجل قبل كده.",
  "auth/weak-password": "كلمة المرور لازم 6 حروف على الأقل.",
  "auth/too-many-requests": "محاولات كتير، استنى شوية.",
  "permission-denied": "مفيش صلاحية. اتأكد من قواعد Firestore."
};

/* ---------------- طبقة البيانات: Firebase أو تجربة محلية ---------------- */
let api;
if (live) {
  const B = "https://www.gstatic.com/firebasejs/10.12.2/";
  const [{ initializeApp }, A, F] = await Promise.all([
    import(B + "firebase-app.js"), import(B + "firebase-auth.js"), import(B + "firebase-firestore.js")
  ]);
  const app = initializeApp(firebaseConfig), auth = A.getAuth(app), db = F.getFirestore(app);
  const ms = (t) => t?.toMillis?.() ?? Date.now();
  const list = (s) => s.docs.map((d) => ({ id: d.id, ...d.data(), createdAt: ms(d.data().createdAt) }))
                           .sort((a, b) => b.createdAt - a.createdAt);
  api = {
    onAuth: (cb) => A.onAuthStateChanged(auth, (u) => cb(u && { uid: u.uid, name: u.displayName || u.email, email: u.email, isAdmin: u.email === ADMIN_EMAIL })),
    login: (id, p) => A.signInWithEmailAndPassword(auth, toEmail(id), p),
    register: async (n, e, p) => { const c = await A.createUserWithEmailAndPassword(auth, e, p); await A.updateProfile(c.user, { displayName: n }); },
    logout: () => A.signOut(auth),
    watchBooks: (cb, err) => F.onSnapshot(F.collection(db, "books"), (s) => cb(list(s)), err),
    addBook: (b) => F.addDoc(F.collection(db, "books"), { ...b, createdAt: F.serverTimestamp() }),
    delBook: (id) => F.deleteDoc(F.doc(db, "books", id)),
    addOrder: (o) => F.addDoc(F.collection(db, "orders"), { ...o, createdAt: F.serverTimestamp() }),
    watchOrders: (u, cb, err) => {
      const c = F.collection(db, "orders");
      return F.onSnapshot(u.isAdmin ? c : F.query(c, F.where("uid", "==", u.uid)), (s) => cb(list(s)), err);
    },
    setStatus: (id, status) => F.updateDoc(F.doc(db, "orders", id), { status })
  };
} else {
  const K = "library-demo";
  const load = () => JSON.parse(localStorage.getItem(K) || "null") ||
    { users: [{ uid: "admin", name: "المدير", email: ADMIN_USER, pass: "yu1122", isAdmin: true }], books: [], orders: [], session: null };
  let D = load, authCb; D = load();
  const subs = new Set();
  const save = () => { localStorage.setItem(K, JSON.stringify(D)); subs.forEach((f) => f()); };
  const cur = () => { const u = D.users.find((x) => x.uid === D.session); return u && { uid: u.uid, name: u.name, email: u.email, isAdmin: !!u.isAdmin }; };
  const watch = (f) => { subs.add(f); f(); return () => subs.delete(f); };
  addEventListener("storage", () => { D = load(); subs.forEach((f) => f()); });
  api = {
    onAuth: (cb) => { authCb = cb; cb(cur()); },
    login: async (id, p) => {
      const u = D.users.find((x) => x.email.toLowerCase() === id.toLowerCase() && x.pass === p);
      if (!u) throw { code: "auth/invalid-credential" };
      D.session = u.uid; save(); authCb(cur());
    },
    register: async (n, e, p) => {
      if (p.length < 6) throw { code: "auth/weak-password" };
      if (D.users.some((x) => x.email.toLowerCase() === e.toLowerCase())) throw { code: "auth/email-already-in-use" };
      const u = { uid: "u" + Date.now(), name: n, email: e, pass: p };
      D.users.push(u); D.session = u.uid; save(); authCb(cur());
    },
    logout: async () => { D.session = null; save(); authCb(null); },
    watchBooks: (cb) => watch(() => cb([...D.books])),
    addBook: async (b) => { D.books.unshift({ id: "b" + Date.now(), ...b, createdAt: Date.now() }); save(); },
    delBook: async (id) => { D.books = D.books.filter((b) => b.id !== id); save(); },
    addOrder: async (o) => { D.orders.unshift({ id: "o" + Date.now(), ...o, createdAt: Date.now() }); save(); },
    watchOrders: (u, cb) => watch(() => cb(D.orders.filter((o) => u.isAdmin || o.uid === u.uid))),
    setStatus: async (id, s) => { D.orders.find((o) => o.id === id).status = s; save(); }
  };
  const bn = document.getElementById("banner");
  bn.hidden = false;
  bn.textContent = "وضع التجربة: البيانات محفوظة على جهازك بس، والطلبات مش هتوصل للمدير من جهاز تاني. عشان تشتغل بجد حط إعدادات Firebase في الكود.";
}

/* ---------------- الواجهة ---------------- */
const $ = (id) => document.getElementById(id);
const h = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
const say = (el, t, ok = false) => { el.textContent = t; el.classList.toggle("ok", ok); };
const errText = (e) => ERR[e?.code] || "حصل خطأ، جرب تاني.";
const color = (s) => { let x = 0; for (const c of s) x = (x * 31 + c.charCodeAt(0)) % 360; return `hsl(${x} 35% 38%)`; };
const when = (t) => new Date(t).toLocaleString("ar-EG", { dateStyle: "medium", timeStyle: "short" });

let user = null, books = [], orders = [], cart = new Map(), phone = "", note = "", tab = "books";
let offBooks, offOrders;

function showTab(t) {
  tab = t;
  $("tBooks").classList.toggle("on", t === "books");
  $("tOrders").classList.toggle("on", t === "orders");
  $("booksView").hidden = t !== "books";
  $("ordersView").hidden = t !== "orders";
}
$("tBooks").onclick = () => showTab("books");
$("tOrders").onclick = () => showTab("orders");
$("tLogin").onclick = () => authTab(true);
$("tReg").onclick = () => authTab(false);
function authTab(login) {
  $("loginForm").hidden = !login; $("regForm").hidden = login;
  $("tLogin").classList.toggle("on", login); $("tReg").classList.toggle("on", !login);
  say($("authMsg"), "");
}

$("lBtn").onclick = async () => {
  try { await api.login($("lId").value.trim(), $("lPass").value); } catch (e) { say($("authMsg"), errText(e)); }
};
$("rBtn").onclick = async () => {
  const n = $("rName").value.trim();
  if (!n) return say($("authMsg"), "اكتب اسمك.");
  try {
    await api.register(n, $("rEmail").value.trim(), $("rPass").value);
    if (user) { user.name = n; $("userName").textContent = n; }
  } catch (e) { say($("authMsg"), errText(e)); }
};
$("logout").onclick = () => api.logout();

api.onAuth((u) => {
  offBooks?.(); offOrders?.(); offBooks = offOrders = null;
  user = u; cart.clear(); books = []; orders = [];
  $("authView").hidden = !!u; $("appView").hidden = !u; $("userBar").hidden = !u;
  if (!u) return;
  $("userName").textContent = u.name;
  $("role").textContent = u.isAdmin ? "مدير" : "عضو";
  $("adminPanel").hidden = !u.isAdmin;
  $("cart").hidden = u.isAdmin;
  say($("authMsg"), "");
  showTab("books");
  const bad = (e) => say($("adminMsg"), errText(e));
  offBooks = api.watchBooks((l) => { books = l; drawBooks(); drawCart(); }, bad);
  offOrders = api.watchOrders(u, (l) => { orders = l; drawOrders(); }, bad);
});

/* إضافة كتاب (المدير) */
$("bAdd").onclick = async () => {
  const title = $("bTitle").value.trim(), author = $("bAuthor").value.trim();
  const copies = parseInt($("bCopies").value, 10);
  if (!title || !author) return say($("adminMsg"), "اكتب اسم الكتاب والمؤلف.");
  if (!(copies >= 1)) return say($("adminMsg"), "عدد النسخ لازم 1 أو أكتر.");
  try {
    await api.addBook({ title, author, category: $("bCat").value.trim(), copies });
    ["bTitle", "bAuthor", "bCat"].forEach((i) => ($(i).value = "")); $("bCopies").value = 1;
    say($("adminMsg"), "تمت إضافة الكتاب.", true);
  } catch (e) { say($("adminMsg"), errText(e)); }
};

/* الكتب */
$("search").oninput = drawBooks;
function drawBooks() {
  const term = $("search").value.trim().toLowerCase();
  const list = books.filter((b) => [b.title, b.author, b.category].join(" ").toLowerCase().includes(term));
  $("books").replaceChildren(...list.map((b) => {
    const acts = h("div", { className: "acts" }, h("span", {}, `${b.copies} نسخة`));
    if (user.isAdmin) {
      acts.append(h("button", { className: "danger", textContent: "حذف", onclick: async () => {
        if (confirm(`حذف "${b.title}"؟`)) try { await api.delBook(b.id); } catch (e) { say($("adminMsg"), errText(e)); }
      } }));
    } else {
      const inCart = cart.has(b.id);
      acts.append(h("button", { className: "small", textContent: inCart ? "شيل من الطلب" : "أضف للطلب",
        onclick: () => { inCart ? cart.delete(b.id) : cart.set(b.id, b); drawBooks(); drawCart(); } }));
    }
    return h("article", { className: "book" },
      h("div", { className: "spine", style: `background:${color(b.title || "")}` }),
      h("div", {}, h("h3", {}, b.title), h("p", {}, b.author + (b.category ? " — " + b.category : ""))),
      acts);
  }));
  $("noBooks").hidden = list.length > 0;
  $("noBooks").textContent = books.length ? "مفيش كتب مطابقة للبحث." : "مفيش كتب لسه. المدير هيضيف كتب قريب.";
}

/* سلة الطلب (للعضو) */
function drawCart() {
  const box = $("cart");
  if (!user || user.isAdmin) return;
  box.replaceChildren(h("h2", {}, "طلبك"));
  if (!cart.size) { box.append(h("p", { className: "muted" }, "اختار كتب من القايمة وهتظهر هنا.")); return; }
  const ul = h("ul");
  cart.forEach((b, id) => ul.append(h("li", {}, h("span", {}, b.title),
    h("button", { className: "danger", textContent: "×", onclick: () => { cart.delete(id); drawBooks(); drawCart(); } }))));
  const msg = h("p", { className: "msg", role="alert" });
  const send = h("button", { className: "primary", textContent: "إرسال الطلب", onclick: async () => {
    if (!phone.trim()) return say(msg, "اكتب رقم موبايلك.");
    try {
      await api.addOrder({
        uid: user.uid, name: user.name, email: user.email, phone: phone.trim(), note: note.trim(),
        items: [...cart.values()].map((b) => ({ id: b.id, title: b.title, author: b.author })), status: STATUSES[0]
      });
      cart.clear(); phone = ""; note = ""; drawBooks(); drawCart(); showTab("orders");
    } catch (e) { say(msg, errText(e)); }
  } });
  box.append(ul,
    h("div", { className: "stack" },
      h("input", { placeholder: "رقم الموبايل", dir: "ltr", value: phone, oninput: (e) => (phone = e.target.value) }),
      h("textarea", { placeholder: "ملاحظات أو عنوان التسليم", rows: 3, value: note, oninput: (e) => (note = e.target.value) }),
      send, msg));
}

/* الطلبات */
function drawOrders() {
  const fresh = orders.filter((o) => o.status === STATUSES[0]).length;
  $("tOrders").textContent = user.isAdmin ? `الطلبات${fresh ? ` (${fresh} جديد)` : ""}` : "طلباتي";
  $("orders").replaceChildren(...orders.map((o) => {
    const status = user.isAdmin
      ? h("select", { onchange: async (e) => { try { await api.setStatus(o.id, e.target.value); } catch (x) { alert(errText(x)); } } },
          ...STATUSES.map((s) => h("option", { value: s, textContent: s, selected: s === o.status })))
      : h("span", { className: "badge" }, o.status);
    status.style.width = user.isAdmin ? "auto" : "";
    const card = h("div", { className: "card order" },
      h("header", {}, h("strong", {}, user.isAdmin ? `${o.name} — ${o.phone}` : `طلب ${when(o.createdAt)}`), status),
      h("ul", {}, ...o.items.map((i) => h("li", {}, `${i.title} — ${i.author}`))));
    if (o.note) card.append(h("p", { className: "muted" }, "ملاحظات: " + o.note));
    if (user.isAdmin) card.append(h("p", { className: "muted" }, `${o.email} — ${when(o.createdAt)}`));
    return card;
  }));
  $("noOrders").hidden = orders.length > 0;
  $("noOrders").textContent = user.isAdmin ? "مفيش طلبات لسه." : "ماعملتش طلبات لسه.";
}
</script>
</body>
</html>
